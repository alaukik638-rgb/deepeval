<!DOCTYPE html>
<html>
<head>
    <title>Machine Learning Predictor</title>
</head>

<body>

<h2>Prediction Demo</h2>

<form action="/predict" method="POST">

    <label>Feature 1</label><br>
    <input type="number" step="any" name="feature1" required><br><br>

    <label>Feature 2</label><br>
    <input type="number" step="any" name="feature2" required><br><br>

    <button type="submit">
        Predict
    </button>

</form>

{% if prediction is defined %}

<h2>
Prediction: {{ prediction }}
</h2>

{% endif %}

</body>
</html>
